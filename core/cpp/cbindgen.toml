# include/thesmos/thesmos.h is generated from src/lib.rs by cbindgen and committed. CI regenerates
# it and fails on any difference, so the header always declares exactly what the library exports.
language = "C"
include_guard = "THESMOS_H"
cpp_compat = true
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
documentation = true
documentation_style = "c99"
autogen_warning = "/* Generated by cbindgen from core/cpp/src/lib.rs. Do not edit; see core/cpp/cbindgen.toml. */"
header = "/* The Spaces receiver for C and C++: thesmos's Rust receiver behind a C ABI. Apache-2.0. */"

[export.rename]
"ThesmosValue" = "thesmos_value"
"ThesmosVerifier" = "thesmos_verifier"
"ThesmosBuffer" = "thesmos_buffer"
"ThesmosBytes" = "thesmos_bytes"
"ThesmosDecision" = "thesmos_decision"
"ThesmosAuthenticate" = "thesmos_authenticate"

[fn]
args = "auto"
