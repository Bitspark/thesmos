name: release
# Releases a qualified, merged release commit (CONTRIBUTING.md): its tags, its GitHub release with
# the npm archive that check.yml built from it, a release manifest and SHA256SUMS, and its packages
# on npm (@bitspark/thesmos), crates.io (bitspark-thesmos) and PyPI (bitspark-thesmos). It runs no
# receiver tests of its own: it checks through the API that every receiver job of the qualifying
# check.yml run ran every step, on a commit with the release commit's core/ tree. The Python wheels
# and the sdist are built here from the release commit, and each is installed and run against the
# TypeScript-signed Archon proof before anything is published.
#
# `release` is dispatched from main only; `rehearse` and `verify` write nothing and run from any
# branch, so a change to this workflow is tried before it merges. There is no tag trigger: a
# release pushes two tags, which would trigger one.
#   rehearse  every check, the wheels and the sdist, and the npm and crates.io uploads as dry runs;
#             the candidate and the Python distributions become workflow artifacts; writes nothing
#   release   the same, then, behind the `release` environment, creates the missing tags and the
#             GitHub release or finishes a partial one, and publishes each package its registry
#             does not have yet; then verify
#   verify    reads only: the tags, the release's files, and an anonymous install from each
#             registry that serves the version
#
# Registry credentials. None is stored once a registry trusts this workflow: npm, crates.io and
# PyPI each accept this run's OIDC identity for Bitspark/thesmos, release.yml and the `release`
# environment. Each is armed by a repository variable, so a registry that is not configured yet
# gets a warning instead of a red release, and a re-dispatch publishes only what is missing:
#   npm        vars.NPM_TRUSTED_PUBLISHING, with provenance
#   crates.io  vars.CRATES_IO_TRUSTED_PUBLISHING, through rust-lang/crates-io-auth-action
#   PyPI       vars.PYPI_TRUSTED_PUBLISHING, with attestations; PyPI accepts a pending publisher
# npm and crates.io attach a trusted publisher only to a package that exists, so their first
# version is published by this same job with a bootstrap token the service desk places in the
# `release` environment (NPM_BOOTSTRAP_TOKEN, CARGO_BOOTSTRAP_TOKEN) and removes afterwards; that
# npm version carries no provenance. Provenance and attestations name the commit this workflow runs
# at, so trusted publishing is refused unless main is at the release commit when it is dispatched.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [rehearse, release, verify]
        default: rehearse
      version:
        description: The version, as in package.json (for example 1.0.0-preview.8)
        required: true
      commit:
        description: The release commit, the release PR's squash merge on main (full hash)
        required: true
      qualifying_run:
        description: The check.yml run on the release PR's head (rehearse and release)
        required: false
      qualifying_attempt:
        description: That run's attempt
        required: false
        default: '1'
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  check:
    if: inputs.mode != 'verify'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: A release is dispatched from main
        if: inputs.mode == 'release'
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::dispatch release.yml from main, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: The release environment is protected
        if: inputs.mode == 'release'
        # A job naming a missing environment would create it unprotected and run at once.
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq '[.protection_rules[]?.type] | index("required_reviewers")' | grep -qx '[0-9][0-9]*'; then
            echo "::error::the release environment is missing or has no required reviewers"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check the release commit, the qualifying run and the tags
        run: bash scripts/release/release.sh check "$VERSION" "$COMMIT" "$RUN" "$ATTEMPT"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          RUN: ${{ inputs.qualifying_run }}
          ATTEMPT: ${{ inputs.qualifying_attempt }}
      - name: Assemble the candidate
        run: bash scripts/release/release.sh candidate "$VERSION" "$COMMIT" "$RUN" "$ATTEMPT" "$RUNNER_TEMP/candidate"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          RUN: ${{ inputs.qualifying_run }}
          ATTEMPT: ${{ inputs.qualifying_attempt }}
      - name: Rehearse the npm and crates.io uploads
        run: |
          bash scripts/release/release.sh npm "$VERSION" "$COMMIT" "$RUNNER_TEMP/candidate" --dry-run
          bash scripts/release/release.sh crate "$VERSION" "$COMMIT" --dry-run
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.version }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
  wheels:
    # One abi3 wheel per platform for CPython 3.10 and later, built from the release commit, each
    # installed on its own platform's runner and run against the Archon proof before upload.
    if: inputs.mode != 'verify'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64 }
          - { name: macos-universal2, os: macos-latest, target: universal2-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: The pinned Rust
        id: rust
        run: echo "toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' core/py/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: core/py
          target: ${{ matrix.target }}
          manylinux: auto
          rust-toolchain: ${{ steps.rust.outputs.toolchain }}
          args: --release --locked --out dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the wheel and verify the Archon proof with it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"; [ -x "$py" ] || py="$RUNNER_TEMP/venv/Scripts/python.exe"
          "$py" -m pip install --no-index --find-links core/py/dist bitspark-thesmos
          "$py" scripts/consumers/py/verify.py core/rs/tests/data/archon-document.ontos
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.name }}
          path: core/py/dist/*.whl
          if-no-files-found: error
  sdist:
    # The source distribution, built from the release commit, then built from itself into a wheel
    # as pip would for a platform without a wheel, and run against the Archon proof.
    if: inputs.mode != 'verify'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: core/py
          command: sdist
          args: --out dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build the sdist and verify the Archon proof with it
        run: |
          (cd core/py && rustup toolchain install && rustup show active-toolchain)
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-binary bitspark-thesmos core/py/dist/*.tar.gz
          "$RUNNER_TEMP/venv/bin/python" scripts/consumers/py/verify.py core/rs/tests/data/archon-document.ontos
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: core/py/dist/*.tar.gz
          if-no-files-found: error
  publish:
    if: inputs.mode == 'release'
    needs: [check, wheels, sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # Trusted publishing on npm, crates.io and PyPI; npm provenance and PyPI attestations.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ inputs.version }}
          path: ${{ runner.temp }}/candidate
      - name: Create the tags and the GitHub release, or finish a partial one
        run: bash scripts/release/release.sh publish "$VERSION" "$COMMIT" "$RUNNER_TEMP/candidate"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
      # npm 11.5.1 or later exchanges this run's OIDC identity for publish rights when npm trusts
      # this workflow, so trusted mode sets no NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish the npm archive
        run: bash scripts/release/release.sh npm "$VERSION" "$COMMIT" "$RUNNER_TEMP/candidate"
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          NPM_PUBLISH: ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' && 'trusted' || (secrets.NPM_BOOTSTRAP_TOKEN != '' && 'bootstrap' || 'off') }}
          NODE_AUTH_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHING != 'true' && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
      - name: A crates.io token from this run's identity
        id: crates-io
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish the crate
        run: bash scripts/release/release.sh crate "$VERSION" "$COMMIT"
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token || secrets.CARGO_BOOTSTRAP_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          merge-multiple: true
          path: ${{ runner.temp }}/python
      - name: The Python distributions, at the release commit
        id: python
        run: |
          pep440=${VERSION/-preview./rc}
          ls -l "$RUNNER_TEMP/python"
          [ "$(ls "$RUNNER_TEMP/python" | wc -l)" = 5 ] || { echo "::error::expected four wheels and an sdist"; exit 1; }
          for f in "$RUNNER_TEMP"/python/*; do
            case $(basename "$f") in bitspark_thesmos-"$pep440"[-.]*) ;; *) echo "::error::$f is not bitspark-thesmos $pep440"; exit 1 ;; esac
          done
          if curl -sf "https://pypi.org/pypi/bitspark-thesmos/$pep440/json" >/dev/null; then
            echo "PyPI already serves bitspark-thesmos $pep440; skip-existing uploads only what is missing"
          fi
          if [ "$ARMED" = true ] && [ "$GITHUB_SHA" != "$COMMIT" ]; then
            echo "::error::this run is at $GITHUB_SHA, not the release commit $COMMIT, so the attestations would name the wrong source"
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          ARMED: ${{ vars.PYPI_TRUSTED_PUBLISHING == 'true' }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
        with:
          packages-dir: ${{ runner.temp }}/python
          skip-existing: true
      - name: What PyPI did not get
        if: vars.PYPI_TRUSTED_PUBLISHING != 'true'
        run: echo "::warning::bitspark-thesmos was built but not published to PyPI because vars.PYPI_TRUSTED_PUBLISHING is not 'true'"
  verify:
    needs: publish
    if: always() && (inputs.mode == 'verify' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: The tags and the release's files
        run: bash scripts/release/release.sh verify "$VERSION" "$COMMIT"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
      - name: An anonymous install from each registry
        run: bash scripts/release/release.sh registries "$VERSION" "$COMMIT"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          PYTHON: python
          EXPECT_REGISTRIES: >-
            ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' && 'npm' || '' }}
            ${{ vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' && 'crates' || '' }}
            ${{ vars.PYPI_TRUSTED_PUBLISHING == 'true' && 'pypi' || '' }}
