name: check
on:
  push:
    branches: [main, 'core/**']
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_lock:
        description: Prepare a lockfile artifact remotely; this does not qualify a release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  refresh-lock:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bitspark'
      - run: npm install --package-lock-only --ignore-scripts --allow-remote=all --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: thesmos-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
  source:
    if: github.event_name != 'workflow_dispatch' || !inputs.refresh_lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-frozen.mjs && node scripts/embed-law.mjs --check-go && node scripts/check-links.mjs && git diff --check
  sdk:
    # Private Logos packages are available only to maintained repository code.
    # External PRs receive the public source checks, pending dependency publication.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !inputs.refresh_lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bitspark'
      - run: npm ci --ignore-scripts --allow-remote=all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
      - run: npm run check
      - name: Export deterministic proof-capacity inputs
        run: node dist/scripts/export-proof-capacity.js "$RUNNER_TEMP/proof-capacity-inputs" "$QUALIFIED_REVISION"
        env:
          QUALIFIED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: thesmos-proof-capacity-inputs-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/proof-capacity-inputs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: thesmos-package
          path: .build-artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
  go:
    # The Go receiver (core/go). Its Logos contract module is private. The service desk
    # issues a read-only LOGOS_SOURCE_READ_TOKEN (Bitspark/logos contents only) for
    # qualifying runs; without it this job only checks formatting and says so. A release
    # needs a run in which this job's tests ran. Ontos and archon are public.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !inputs.refresh_lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/go
    env:
      GOPRIVATE: github.com/Bitspark/logos
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go/go.mod
          # No module cache: it would hold the private Logos source, and caches reach other runs.
          cache: false
      - run: test -z "$(gofmt -l .)"
      - name: Read access to the private Logos module
        id: access
        run: |
          if [ -z "$LOGOS_SOURCE_READ_TOKEN" ]; then
            echo "::warning title=Go receiver not tested::LOGOS_SOURCE_READ_TOKEN is not configured, so this run did not build or test core/go."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --global url."https://x-access-token:${LOGOS_SOURCE_READ_TOKEN}@github.com/Bitspark/logos".insteadOf "https://github.com/Bitspark/logos"
          echo "ready=true" >> "$GITHUB_OUTPUT"
        env:
          LOGOS_SOURCE_READ_TOKEN: ${{ secrets.LOGOS_SOURCE_READ_TOKEN }}
      - if: steps.access.outputs.ready == 'true'
        run: go vet ./... && go test -v ./... && go mod verify
  rust:
    # The Rust receiver (core/rs), Windows first as its first consumer needs, then Linux and
    # macOS. logos-contract comes from the private Logos repository by tag, through the same
    # read-only LOGOS_SOURCE_READ_TOKEN as the Go job; without it this job only checks
    # formatting and says so. A release needs a run in which these tests ran. Only `cargo fetch`
    # sees the token; everything that builds or runs code is offline and without it.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !inputs.refresh_lock
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: core/rs
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # No cargo cache: it would hold the private Logos source, and caches reach other runs.
      # core/rs/rust-toolchain.toml pins the minimum supported Rust; install exactly it.
      - run: rustup toolchain install && rustup show active-toolchain && cargo fmt --check
      - name: Read access to the private Logos crate
        id: access
        run: |
          if [ -z "$LOGOS_SOURCE_READ_TOKEN" ]; then
            echo "::warning title=Rust receiver not tested::LOGOS_SOURCE_READ_TOKEN is not configured, so this run did not build or test core/rs."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          LOGOS_SOURCE_READ_TOKEN: ${{ secrets.LOGOS_SOURCE_READ_TOKEN }}
      # The token lives only in this step's environment, as a URL rewrite for git (which cargo
      # uses to fetch); no git config file holds it and no build script or tool runs here.
      - name: Fetch the locked sources
        if: steps.access.outputs.ready == 'true'
        run: cargo fetch --locked
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.LOGOS_SOURCE_READ_TOKEN }}@github.com/Bitspark/logos.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/Bitspark/logos
      # Offline and without the token: dependency build scripts and proc macros never see it.
      - if: steps.access.outputs.ready == 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          cargo clippy --locked --offline --all-targets -- -D warnings
          cargo test --locked --offline --no-fail-fast
          cargo build --locked --offline --no-default-features
  cpp-header:
    # core/cpp's C header is generated by cbindgen and must equal the committed one. This needs
    # no Logos access, and runs apart from the cpp job: the prebuilt cbindgen it installs never
    # shares a runner with the Logos token.
    if: github.event_name != 'workflow_dispatch' || !inputs.refresh_lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/cpp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      # core/cpp/rust-toolchain.toml pins the same Rust as core/rs; install exactly it.
      - run: |
          rustup toolchain install && rustup show active-toolchain
          cargo fmt --check
          cbindgen --quiet --config cbindgen.toml --output include/thesmos/thesmos.h src/lib.rs
          git diff --exit-code -- include
  cpp:
    # The C and C++ receiver (core/cpp): core/rs behind a C ABI with a C++20 wrapper. Building
    # needs the same read-only LOGOS_SOURCE_READ_TOKEN as the Rust job; without it this job
    # does nothing and says so. A release needs a run in which these tests ran. As in the rust
    # job, only `cargo fetch` sees the token; CMake, Corrosion's Cargo build and the tests run
    # offline and without it.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !inputs.refresh_lock
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: core/cpp
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # No cargo cache: it would hold the private Logos source, and caches reach other runs.
      # core/cpp/rust-toolchain.toml pins the same Rust as core/rs; install exactly it.
      - run: rustup toolchain install && rustup show active-toolchain
      - name: Read access to the private Logos crate
        id: access
        run: |
          if [ -z "$LOGOS_SOURCE_READ_TOKEN" ]; then
            echo "::warning title=C++ receiver not tested::LOGOS_SOURCE_READ_TOKEN is not configured, so this run did not build or test core/cpp."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          LOGOS_SOURCE_READ_TOKEN: ${{ secrets.LOGOS_SOURCE_READ_TOKEN }}
      # The token lives only in this step's environment, as a URL rewrite for git, and must not
      # reach a file. The locked sources land in CARGO_HOME, where Corrosion's Cargo build of the
      # same Cargo.lock finds them offline.
      - name: Fetch the locked sources
        if: steps.access.outputs.ready == 'true'
        run: |
          cargo fetch --locked
          if grep -rqF -- "$LOGOS_SOURCE_READ_TOKEN" "$HOME/.gitconfig" "${CARGO_HOME:-$HOME/.cargo}" 2>/dev/null; then
            echo "::error::the Logos token reached a file during the fetch"
            exit 1
          fi
        env:
          LOGOS_SOURCE_READ_TOKEN: ${{ secrets.LOGOS_SOURCE_READ_TOKEN }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.LOGOS_SOURCE_READ_TOKEN }}@github.com/Bitspark/logos.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/Bitspark/logos
      - if: steps.access.outputs.ready == 'true'
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          cargo clippy --locked --offline -- -D warnings
          if [ "$RUNNER_OS" = macOS ]; then export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build --output-on-failure -C Release
