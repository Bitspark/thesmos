name: check
on:
  push:
    branches: [main, 'core/**']
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Check committed sources, or prepare a reviewable released-dependency patch
        type: choice
        options: [check, refresh-dependencies]
        default: check
      logos_version:
        description: Exact published logos package version for a dependency refresh
        required: false
      ontos_version:
        description: Exact public Ontos cohort required by that Logos release
        required: false
      package_version:
        description: Exact thesmos package version for a dependency refresh
        required: false
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/package-dependencies.test.mjs scripts/refresh-dependencies.test.mjs && node scripts/check-frozen.mjs && node scripts/check-links.mjs && git diff --check
  sdk:
    # Private Logos packages are available only to maintained repository code.
    # External PRs receive the public source checks, pending dependency publication.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && inputs.operation != 'refresh-dependencies'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bitspark'
      - run: npm ci --ignore-scripts --allow-remote=all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thesmos-candidate-dependencies
          path: .build-artifacts/candidate-dependencies.json
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: thesmos-package
          path: |
            .build-artifacts/*.tgz
            .build-artifacts/SHA256SUMS
            .build-artifacts/release-artifact.json
          include-hidden-files: true
          if-no-files-found: error

  dependency-refresh:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'refresh-dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bitspark'
      - name: Check dependency transition boundaries
        run: node --test scripts/package-dependencies.test.mjs scripts/refresh-dependencies.test.mjs
      - name: Prepare the exact published cohort and source patch
        env:
          THESMOS_REFRESH_OPERATION: ${{ inputs.operation }}
          LOGOS_VERSION: ${{ inputs.logos_version }}
          ONTOS_VERSION: ${{ inputs.ontos_version }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
        run: node scripts/refresh-dependencies.mjs
      - name: Retain an incomplete receipt when setup failed before preparation
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { existsSync, mkdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const directory = join(process.env.RUNNER_TEMP, 'dependency-refresh');
          mkdirSync(directory, {recursive: true});
          const receipt = join(directory, 'receipt.json');
          if (!existsSync(receipt)) writeFileSync(receipt, JSON.stringify({
            format: 'thesmos/released-dependencies/1', status: 'incomplete', phase: 'setup-or-boundaries',
            requestedHead: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID,
            failure: {detail: 'Preparation did not produce a source receipt'},
          }, null, 2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thesmos-dependency-refresh-${{ github.run_id }}
          path: ${{ runner.temp }}/dependency-refresh
          if-no-files-found: error
