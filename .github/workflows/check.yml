name: check
on:
  push:
    branches: [main, 'core/**']
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_lock:
        description: Prepare a lockfile artifact remotely; this does not qualify a release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  refresh-lock:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bitspark'
      - run: npm install --package-lock-only --ignore-scripts --allow-remote=all --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: thesmos-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
  source:
    if: github.event_name != 'workflow_dispatch' || !inputs.refresh_lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-frozen.mjs && node scripts/embed-law.mjs --check-go && node scripts/check-links.mjs && git diff --check
  sdk:
    # The SDK's development dependencies include Logos's kernel (for the proof client), a private
    # GitHub package available only to this repository's own code. A fork's pull request gets the
    # public source checks and the Go, Rust, C/C++ and Python receivers.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !inputs.refresh_lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The job's token can read packages; no later step needs it in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bitspark'
      - run: npm ci --ignore-scripts --allow-remote=all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
      - run: npm run check
      - name: Export deterministic proof-capacity inputs
        run: node dist/scripts/export-proof-capacity.js "$RUNNER_TEMP/proof-capacity-inputs" "$QUALIFIED_REVISION"
        env:
          QUALIFIED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: thesmos-proof-capacity-inputs-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/proof-capacity-inputs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: thesmos-package
          path: .build-artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
  go:
    # The Go receiver (core/go). Its dependencies, Logos's contract module, Ontos and archon, are
    # all public, so this job needs no secret and runs on every pull request.
    if: github.event_name != 'workflow_dispatch' || !inputs.refresh_lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/go
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./... && go test -v ./... && go mod verify
  rust:
    # The Rust receiver (core/rs), Windows first as its first consumer needs, then Linux and
    # macOS. logos-contract, Ontos and archon come from crates.io.
    if: github.event_name != 'workflow_dispatch' || !inputs.refresh_lock
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: core/rs
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # core/rs/rust-toolchain.toml pins the minimum supported Rust; install exactly it.
      - run: rustup toolchain install && rustup show active-toolchain && cargo fmt --check
      - run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --no-fail-fast
          cargo build --locked --no-default-features
  cpp-header:
    # core/cpp's C header is generated by cbindgen and must equal the committed one.
    if: github.event_name != 'workflow_dispatch' || !inputs.refresh_lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/cpp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.4
      # core/cpp/rust-toolchain.toml pins the same Rust as core/rs; install exactly it.
      - run: |
          rustup toolchain install && rustup show active-toolchain
          cargo fmt --check
          cbindgen --quiet --config cbindgen.toml --output include/thesmos/thesmos.h src/lib.rs
          git diff --exit-code -- include
  cpp:
    # The C and C++ receiver (core/cpp): core/rs behind a C ABI with a C++20 wrapper, built by
    # CMake through Corrosion. The tests sign the corpus's example keys with OpenSSL 3.
    if: github.event_name != 'workflow_dispatch' || !inputs.refresh_lock
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: core/cpp
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # core/cpp/rust-toolchain.toml pins the same Rust as core/rs; install exactly it.
      - run: rustup toolchain install && rustup show active-toolchain
      - run: |
          cargo clippy --locked -- -D warnings
          if [ "$RUNNER_OS" = macOS ]; then export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build --output-on-failure -C Release
  python:
    # The Python receiver (core/py): core/rs behind PyO3, one abi3 wheel per platform for
    # CPython 3.10 and later, tested on the oldest and newest supported Python. The wheels are
    # built and tested here, never uploaded.
    if: github.event_name != 'workflow_dispatch' || !inputs.refresh_lock
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: core/py
    env:
      CARGO_TERM_COLOR: never
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # core/py/rust-toolchain.toml pins the same Rust as core/rs; install exactly it.
      - run: rustup toolchain install && rustup show active-toolchain && cargo fmt --check
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          cargo clippy --locked -- -D warnings
          python -m pip install maturin==1.15.0 pytest==8.4.2 cryptography==49.0.0
          python -m maturin build --release --locked --out dist
          python -m pip install --no-index --find-links dist bitspark-thesmos
          python -m pytest -q tests
  differential:
    # Every receiver decides the same generated inputs (the frozen corpus, the Archon vector and
    # seeded mutations of both), and permitted, code and checked steps must agree on each:
    # scripts/differential. C++ decides through its C interface (core/cpp's
    # thesmos_differential). The TypeScript side installs the SDK's development dependencies,
    # among them Logos's private kernel package, so like sdk this job runs on this repository's
    # own pull requests only.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !inputs.refresh_lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GOFLAGS: -mod=readonly
      CARGO_TERM_COLOR: never
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The job's token can read packages; no later step needs it in .git/config.
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go/go.mod
          cache: false
      - run: rustup toolchain install && rustup show active-toolchain
        working-directory: core/rs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bitspark'
      - run: npm ci --ignore-scripts --allow-remote=all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - working-directory: core/py
        run: |
          python -m pip install maturin==1.15.0 cryptography==49.0.0
          python -m maturin build --release --locked --out dist
          python -m pip install --no-index --find-links dist bitspark-thesmos
      - working-directory: core/cpp
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target thesmos_differential
      # A fixed seed for a stable baseline, and the run's own seed to explore new inputs; a
      # failure prints the seed, so `--seed <n>` reproduces it locally.
      - run: |
          node scripts/differential/run.mjs --seed 1 --count 1500
          node scripts/differential/run.mjs --seed ${{ github.run_id }} --count 1500
  consumer:
    # Each receiver built from the commit under test as an outside project gets it (README.md):
    # a fresh Go module, a Rust crate with a git dependency, pip from git and a CMake project with
    # FetchContent. Each verifies the TypeScript-signed Archon proof and denies it with one
    # changed byte: scripts/consumers/run.sh. It builds the commit rather than a tag because a
    # release is qualified before it is tagged, on a commit whose core/ tree the tag carries.
    # The consumers clone thesmos at that commit (CMake's FetchContent among them), and a fork's
    # pull request head is on no branch of this repository, so this job runs on this
    # repository's own pull requests only.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !inputs.refresh_lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The module proxy need not serve an unmerged thesmos commit, so Go fetches it from git.
      GOPRIVATE: github.com/Bitspark/thesmos
      CARGO_TERM_COLOR: never
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      REV: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go/go.mod
          cache: false
      - run: rustup toolchain install && rustup show active-toolchain
        working-directory: core/rs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare the consumers
        run: bash scripts/consumers/run.sh prepare "$REV" "$RUNNER_TEMP/consumers"
      - name: Build and run the consumers
        run: bash scripts/consumers/run.sh verify "$REV" "$RUNNER_TEMP/consumers"
