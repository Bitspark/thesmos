name: check
on:
  push:
    branches: [main, 'core/**']
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_lock:
        description: Prepare a lockfile artifact remotely; this does not qualify a release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  refresh-lock:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bitspark'
      - run: npm install --package-lock-only --ignore-scripts --allow-remote=all --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: thesmos-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
  source:
    if: github.event_name != 'workflow_dispatch' || !inputs.refresh_lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-frozen.mjs && node scripts/embed-law.mjs --check-go && node scripts/check-links.mjs && git diff --check
  sdk:
    # Private Logos packages are available only to maintained repository code.
    # External PRs receive the public source checks, pending dependency publication.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !inputs.refresh_lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bitspark'
      - run: npm ci --ignore-scripts --allow-remote=all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
      - run: npm run check
      - name: Export deterministic proof-capacity inputs
        run: node dist/scripts/export-proof-capacity.js "$RUNNER_TEMP/proof-capacity-inputs" "$QUALIFIED_REVISION"
        env:
          QUALIFIED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: thesmos-proof-capacity-inputs-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/proof-capacity-inputs/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: thesmos-package
          path: .build-artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
  go:
    # The Go receiver (core/go). Its Logos contract module is private; the read-only
    # LOGOS_SOURCE_READ_TOKEN reaches only Bitspark/logos. Ontos and archon are public.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !inputs.refresh_lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/go
    env:
      GOPRIVATE: github.com/Bitspark/logos
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go/go.mod
          cache-dependency-path: core/go/go.sum
      - name: Read access to the private Logos module
        run: |
          test -n "$LOGOS_SOURCE_READ_TOKEN" || { echo "::error::LOGOS_SOURCE_READ_TOKEN is not configured"; exit 1; }
          git config --global url."https://x-access-token:${LOGOS_SOURCE_READ_TOKEN}@github.com/Bitspark/logos".insteadOf "https://github.com/Bitspark/logos"
        env:
          LOGOS_SOURCE_READ_TOKEN: ${{ secrets.LOGOS_SOURCE_READ_TOKEN }}
      - run: test -z "$(gofmt -l .)" && go vet ./... && go test ./... && go mod verify
